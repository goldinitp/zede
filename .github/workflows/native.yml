name: native

on:
  push:
    branches: [main, rust-native]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build (release)
        run: cargo build --release

      # Headless end-to-end checks — real PTYs on unix, logic-only on Windows.
      - name: Selftest
        run: cargo run --release -- --selftest

      - name: Bundle Zede.app + DMG
        if: runner.os == 'macOS'
        run: ./scripts/bundle-mac.sh --dmg

      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Zede-macos-arm64
          path: |
            native/target/bundle/*.dmg

      - name: Upload binary
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zede-${{ matrix.name }}
          path: |
            native/target/release/zede
            native/target/release/zede.exe
          if-no-files-found: ignore
