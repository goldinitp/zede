appId: com.zede.app
productName: Zede
directories:
  buildResources: build
files:
  - out/**
  - package.json
  # Keep the PNG master available to the running app as well as to the packager.
  - build/icon.png
# Native .node addons (better-sqlite3, node-pty) must be unpacked from the asar
# so they can be dlopen'd at runtime.
asarUnpack:
  - "**/*.node"
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Current arch only by default (fast local builds). `pnpm dist:release`
  # passes --arm64 --x64 explicitly to produce both architectures.
  target:
    - dmg
    - zip
  # Hardened runtime + entitlements are required for notarization. Signing and
  # notarization need an Apple Developer ID cert + credentials in the environment
  # (CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID). See CONTRIBUTING.md. Left enabled so a credentialed build
  # signs correctly; an unsigned local `dist` still produces a runnable .app.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
# Notarize only when credentials are present (electron-builder skips otherwise).
afterSign: build/notarize.cjs
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
